# Dependabot moves the pins. Every `uses:` in .github/workflows is pinned to a full
# commit SHA with a `# vX.Y.Z` comment (#423); Dependabot rewrites both the SHA and the
# comment, so an action update arrives as a reviewable PR rather than a mutable tag
# resolving to whatever it points at on release day. npm devDependencies (the build,
# test and release toolchain, all lock-pinned) get the same treatment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # `upload-artifact` and `download-artifact` share an artifact format, so
      # `test/workflow-pins.test.ts` requires the pair on ONE major everywhere. Their majors
      # do not ship in lockstep (#476 put upload on v7 and download on v8), so a grouped
      # major bump splits the pair and fails the guard. Hold both majors here and move the
      # pair together by hand (#629); patch and minor updates still flow.
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TamperWard is built on the TypeScript COMPILER API (AST nodes, ScriptTarget,
      # ts.forEachChild, isAsExpression, …). TypeScript 7.0 is the native port, whose
      # `typescript` package no longer exports that JS API the same way, so a major bump
      # breaks typecheck and every AST detector wholesale (#471). Hold TypeScript on 5.x
      # — patch and minor updates still flow — until the codebase can adopt the port.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # `engines.node` is `>=20.19` and CI tests Node 20/22/24 as a tested claim. `@types/node`
      # describes a runtime: a major past the floor lets code that only exists on a newer
      # typecheck cleanly and then crash on the Node the package promises (#623). Hold the types
      # on their current major line; patch and minor updates still flow.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
