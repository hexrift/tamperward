# Dependabot moves the pins. Every `uses:` in .github/workflows is pinned to a full
# commit SHA with a `# vX.Y.Z` comment (#423); Dependabot rewrites both the SHA and the
# comment, so an action update arrives as a reviewable PR rather than a mutable tag
# resolving to whatever it points at on release day. npm devDependencies (the build,
# test and release toolchain, all lock-pinned) get the same treatment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TamperWard is built on the TypeScript COMPILER API (AST nodes, ScriptTarget,
      # ts.forEachChild, isAsExpression, …). TypeScript 7.0 is the native port, whose
      # `typescript` package no longer exports that JS API the same way, so a major bump
      # breaks typecheck and every AST detector wholesale (#471). Hold TypeScript on 5.x
      # — patch and minor updates still flow — until the codebase can adopt the port.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
