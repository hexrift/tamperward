# Exclude captured third-party benchmark repositories from secret scanning.
#
# The taskbench rounds archive real open-source repos as evidence — their tree
# snapshots (`*.tar`), extracted `snapshots/` trees, and the counted-task `pools/`
# (patches and manifests of those repos). Some of those repos carry example
# secrets in their own fixtures — most visibly Yelp/detect-secrets, a secret
# scanner whose test data IS fake secrets — which GitHub flags as "public leak."
# Those are not this project's credentials and there is nothing to rotate.
#
# Scope is the captured material only. The runner scripts under
# `harness/taskbench/runner/` are our own code and are deliberately NOT excluded,
# so a real secret committed to the project's own code stays visible.
paths-ignore:
  - 'harness/taskbench/**/*.tar'
  - 'harness/taskbench/**/snapshots/**'
  - 'harness/taskbench/**/pools/**'
