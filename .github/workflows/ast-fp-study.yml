name: ast-fp-study

on:
  pull_request:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build candidate and trusted base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run build
          git worktree add --detach /tmp/tw-base "$BASE_SHA"
          cd /tmp/tw-base
          npm ci
          npm run build
      - name: compare pinned real mainline diffs
        env:
          IMMER_SHA: 061c2425e1c9dff89e4e4189d42af1b7839dfe0a
          ZUSTAND_SHA: b57db4f86ef179285da216eeb291266da82c361c
          ZOD_SHA: ca0229a404818290e6cdcfefcd7eb2d04bcbb543
          HONO_SHA: 8755b17fbcfdee76511eeb460e18e94e6c9a8d30
        run: |
          set -eu
          mkdir -p /tmp/corpus

          fetch_pinned () {
            name="$1"
            url="$2"
            sha="$3"
            dir="/tmp/corpus/$name"
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch -q --depth 101 origin "$sha"
            git -C "$dir" checkout -q --detach "$sha"
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          }

          fetch_pinned immer https://github.com/immerjs/immer.git "$IMMER_SHA"
          fetch_pinned zustand https://github.com/pmndrs/zustand.git "$ZUSTAND_SHA"
          fetch_pinned zod https://github.com/colinhacks/zod.git "$ZOD_SHA"
          fetch_pinned hono https://github.com/honojs/hono.git "$HONO_SHA"

          for repo in immer zustand zod hono; do
            node harness/fp-study/test-skip-ast-delta.mjs \
              "$repo" "/tmp/corpus/$repo" \
              /tmp/tw-base/dist/cli/index.js \
              "$GITHUB_WORKSPACE/dist/cli/index.js"
          done
