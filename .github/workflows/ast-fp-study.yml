name: ast-fp-study

on:
  pull_request:

permissions:
  contents: read

jobs:
  study:
    name: study (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: immer
            url: https://github.com/immerjs/immer.git
            sha: 061c2425e1c9dff89e4e4189d42af1b7839dfe0a
          - name: zustand
            url: https://github.com/pmndrs/zustand.git
            sha: b57db4f86ef179285da216eeb291266da82c361c
          - name: zod
            url: https://github.com/colinhacks/zod.git
            sha: ca0229a404818290e6cdcfefcd7eb2d04bcbb543
          - name: hono
            url: https://github.com/honojs/hono.git
            sha: 8755b17fbcfdee76511eeb460e18e94e6c9a8d30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build candidate and trusted base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run build
          git worktree add --detach /tmp/tw-base "$BASE_SHA"
          cd /tmp/tw-base
          npm ci
          npm run build
      - name: compare pinned real mainline diff
        run: |
          set -eu
          dir="/tmp/corpus/${{ matrix.name }}"
          mkdir -p /tmp/corpus
          git init -q "$dir"
          git -C "$dir" remote add origin "${{ matrix.url }}"
          git -C "$dir" fetch -q --depth 101 origin "${{ matrix.sha }}"
          git -C "$dir" checkout -q --detach "${{ matrix.sha }}"
          test "$(git -C "$dir" rev-parse HEAD)" = "${{ matrix.sha }}"

          node harness/fp-study/test-skip-ast-delta.mjs             "${{ matrix.name }}" "$dir"             /tmp/tw-base/dist/cli/index.js             "$GITHUB_WORKSPACE/dist/cli/index.js"
