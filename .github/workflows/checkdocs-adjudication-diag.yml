name: checkdocs-adjudication-diag

# DIAGNOSTIC v2 for round-4 Finding 2 — manual, non-required, never on push. Runs
# no trajectory, needs no credential, writes no verdict. It re-diagnoses seq 18's
# pristine red against the REAL scoring path (agent-jail4.sh mount/PID jail, RO
# interpreter, fresh HOME/TMPDIR, network present), after the first diagnostic was
# found to have modeled the agent's network environment rather than the
# adjudicator's. See harness/taskbench/round4/checkdocs-adjudication-diag.sh.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: round4-checkdocs-adj-diag
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the pilot state branch (the recorded final tree lives there)
        run: git fetch --no-tags origin round4-pilot-state:refs/remotes/origin/round4-pilot-state
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.8.17'
      - name: Tooling (jq, util-linux for unshare)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq util-linux
      # Under sudo, exactly as the pilot ran run-task4.sh (`sudo -E env
      # "PATH=$PATH" ...`): ubuntu-latest does not permit UNPRIVILEGED
      # unshare --mount, so the isolation selftest SKIPs there and the real jail
      # ran as root. `env "PATH=$PATH"` carries the setup-python/setup-uv tools
      # onto root's PATH. Still no netns — network is present by design.
      - name: Run the adjudication-equivalent matrix
        run: sudo -E env "PATH=$PATH" bash harness/taskbench/round4/checkdocs-adjudication-diag.sh
      - name: Publish the diagnostic record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkdocs-adjudication-diag
          path: ${{ runner.temp }}/checkdocs-adj-diag/
          if-no-files-found: warn
