name: ci

# PULL REQUESTS ONLY. A push-to-main trigger would re-run the same suite on a commit
# that is, in the ordinary case, identical in content to the one just verified: the
# ruleset requires a branch to be up to date with main before it can merge, so every
# PR head is tested against current main immediately before landing. Paying for that
# answer twice bought a signal on main itself, and nothing here reads that signal —
# no badge, no downstream workflow, no deployment gate keys off it.
#
# What this gives up, stated plainly: a squash merge creates a commit no run has tested
# verbatim, so if main ever does break, CI will not be what tells you.
on:
  # labeled/unlabeled: the tamperward gate reads its out-of-band sign-off from the PR's
  # labels via the EVENT PAYLOAD, and a re-run reuses the original payload — so a label
  # applied after the run could never be seen by re-running. Labeling re-evaluates the
  # gate; so does UN-labeling, because revoking a sign-off must re-block, not linger
  # green until the next push.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Least privilege: this pipeline reads the repo and runs tests. Nothing in it needs a
# write-scoped token, and a security tool should not model bad habits in its own CI.
permissions:
  contents: read

# A superseded push should stop burning a runner, and two runs racing on one ref can
# report out of order — which matters when a required check gates the merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Do the TYPES check? Runs once: types do not vary by Node version, so putting this in
  # the matrix paid for the same answer three times.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Is the CODE correct, on every Node the package claims to support?
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines >=18. CI only ever proved 22, so the stated
        # floor was an untested claim; these legs are what make it true.
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Is the ARTIFACT sound? Distinct question from "is the code correct", and it has its
  # own failure mode: `files: [dist]` with dist/ gitignored once shipped a tarball
  # containing no binary at all. Nothing in CI installed what npm would actually publish,
  # so nothing caught it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Smoke-test the published artifact
        run: |
          set -euo pipefail
          TGZ="$(npm pack --silent)"
          WORK="$(mktemp -d)"
          cd "$WORK" && npm init -qy >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TGZ" >/dev/null
          FIRST="$(./node_modules/.bin/tamperward 2>&1 | head -1)"
          echo "installed CLI says: $FIRST"
          case "$FIRST" in
            tamperward*) echo "artifact OK — bin resolves, is executable, and runs" ;;
            *) echo "published artifact is broken"; exit 1 ;;
          esac

  # Does the CHANGE violate the integrity policy? The dogfood job: Tamperward gates its
  # own repo with the engine it ships. Rebuilds rather than passing an artifact around —
  # the bundle takes milliseconds and the CLI needs its runtime deps installed anyway.
  gate:
    needs: [typecheck, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the range diff has both endpoints
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # SPEC §5.4: in CI a sign-off must be OUT OF BAND — never a file the same PR can
      # commit, because then the change being blocked could authorise itself. The channel
      # is a PR label `tamperward:allow:<rule>`, which only someone with write access can
      # apply, further gated by branch protection + CODEOWNERS.
      #
      # Label text is user-controlled, so it is passed through env and parsed with jq —
      # never interpolated into the shell, which would be a command-injection hole in the
      # one workflow that must not have one.
      - name: Resolve out-of-band sign-off from PR labels
        id: oob
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          RULES="$(printf '%s' "$LABELS" | jq -r '.[] | select(startswith("tamperward:allow:")) | sub("^tamperward:allow:"; "")' | paste -sd, -)"
          echo "rules=$RULES" >> "$GITHUB_OUTPUT"
          [ -n "$RULES" ] && echo "out-of-band approval present for: $RULES" || echo "no out-of-band approval on this PR"

      - name: Tamperward self-gate
        env:
          TAMPERWARD_OOB_SIGNOFF: ${{ steps.oob.outputs.rules }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE...$PR_HEAD"
          else
            # A force-push leaves `before` pointing at a commit that no longer exists.
            # Using it unchecked yields an empty range — a gate that passes by accident,
            # which is the failure mode this whole project exists to prevent.
            if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              if ! git rev-parse --verify --quiet "${PUSH_HEAD}^" >/dev/null; then
                echo "root commit and no usable before-sha; nothing to range-check."
                exit 0
              fi
              echo "before-sha unusable (new branch or force-push); falling back to the last commit."
              PUSH_BEFORE="${PUSH_HEAD}^"
            fi
            RANGE="$PUSH_BEFORE...$PUSH_HEAD"
          fi
          echo "Checking range: $RANGE"
          node dist/cli/index.js check --diff "$RANGE"
