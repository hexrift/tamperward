name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the range diff has both endpoints
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Dogfood: Holdfast gates its own repo with the same engine it ships.
      - name: Holdfast self-gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "No before-sha (first push); nothing to range-check."
              exit 0
            fi
            RANGE="$BEFORE...${{ github.sha }}"
          fi
          echo "Checking range: $RANGE"
          node dist/cli/index.js check --diff "$RANGE"
