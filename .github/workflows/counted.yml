name: counted

# Round-4 COUNTED trajectory runner — MANUAL, non-required, never on push.
#
# This is the mechanism that actually executes the frozen counted round. It runs
# `counted-drive.sh`, the order-enforcing driver, against
# COUNTED-EXECUTION-MANIFEST.json (264 trajectories = 110×2 primary + 22×2
# duplicate). The driver chooses nothing — tasks, the 22 duplicates, task order,
# arm order, model and treatment were all frozen and are re-verified from the
# manifest's own seeds by `freeze-counted-manifest.mjs --check` before a single
# trajectory runs. It runs the trajectories STRICTLY in frozen seq order, halts
# rather than skipping a gap, and never re-rolls a sampled trajectory.
#
#   check     provision the host and validate the freeze. Runs NO trajectory,
#             needs no credential, touches no state. Dispatch this FIRST and read
#             the environment-drift fingerprint it prints.
#   run-next  run exactly ONE trajectory: the lowest unfinished seq, in order.
#   sweep     run trajectories back-to-back in frozen order, checkpointing after
#             each, until done, halted, or the time budget stops starting new ones.
#
# A trajectory that STARTS (reaches model sampling) is never re-rolled, so
# dispatching run-next / sweep is a deliberate, one-way act. The ONE registered
# exception is the bounded PRE-sampling infrastructure-recovery rule (DEVIATIONS
# D36): the runner retracts its start marker only when the positive execution
# contract cannot prove any model completion, and the driver bounds that retry to
# one — a second pre-sampling failure HALTS for human adjudication (fail closed).
#
# This is NOT one of the required checks in ci.yml. Like pilot.yml and harness.yml
# it costs real model usage and must never gate a merge.
#
# WHY A GITHUB RUNNER WORKS. `ubuntu-latest` is a privileged Linux VM: `iproute2`
# and `nftables` are available and the runner has `sudo`, so `net-jail.sh` builds
# the netns + veth + nftables egress jail. The registered agent authenticates with
# the OAuth token as a secret and reaches api.anthropic.com through the jail's
# allowlist proxy — the same path the pilot and round 3.1 recorded.
#
# ENVIRONMENT DRIFT IS EXPECTED AND HANDLED IN TWO PHASES. A runner is not the
# frozen firecracker host, so `freeze-counted-manifest.mjs` reports ENVIRONMENT
# drift (exit 3) — acknowledgeable, unlike BINDING drift (exit 2), which fails hard
# here and is never acknowledged. Phase 1: dispatch `check`; it prints the exact
# drift fingerprint and stops. Review it. Phase 2: dispatch `run-next` / `sweep`
# with `acknowledge_env_drift: true`; the run records that exact fingerprint and
# proceeds. Also record the drift in DEVIATIONS.md — the acknowledgement lets the
# driver proceed; the ledger is the scientific record.
#
# SAFETY. `run-task4.sh` writes its trajectory-start marker only AFTER the jail is
# up, the gate-liveness probe passes and the agent is about to launch. Any failure
# in provisioning, the jail, or the freeze happens BEFORE that marker, so it does
# not burn a seq — it is cleanly retryable within the driver's bounded recovery.
# Only a failure once the agent has been sampled is a real, non-re-rollable outcome
# that halts the driver for human adjudication.
#
# RESUME. 264 trajectories do not fit one job. The driver checkpoints each verdict
# to the round4-counted-state branch, so re-dispatching `sweep` picks up exactly
# where the last one stopped; the never-re-roll guarantee and the D36 attempt cap
# both survive across dispatches because their evidence lives in runs-counted/.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check (provision + freeze, runs nothing) | run-next (ONE trajectory) | sweep (all remaining, in frozen order, checkpointing each)'
        type: choice
        options: [check, run-next, sweep]
        default: check
      acknowledge_env_drift:
        description: 'run-next / sweep — record the environment drift and proceed. Review the fingerprint from a `check` run first.'
        type: boolean
        default: false

permissions:
  contents: write   # run-next / sweep force-push the runs-counted/ snapshot to a non-protected state branch

concurrency:
  group: round4-counted      # one counted run at a time, ever
  cancel-in-progress: false

jobs:
  trajectory:
    runs-on: ubuntu-latest
    # A single trajectory needs ~65 min worst case (≤50-min agent budget + provisioning).
    # `sweep` runs many back-to-back in one job, checkpointing after each, and stops
    # starting new trajectories ~285 min in (see STOP_AFTER) so the last one finishes
    # well under this ceiling; anything unfinished is resumed by re-dispatching sweep.
    # 350 stays under GitHub's 6 h hard cap while leaving that headroom.
    timeout-minutes: 350
    env:
      # The counted run's OWN checkpoint plumbing, read by ci-pilot-state.sh. This is
      # ISOLATION PLUMBING — it keeps counted state on its own branch and directory so
      # it can never mix with the pilot's (round4-pilot-*), and labels the snapshot
      # commits honestly. It is NOT in the frozen binding set and touches no treatment,
      # driver, runner or adjudicator.
      TB_STATE_DIR: runs-counted
      TB_PILOT_STATE_BRANCH: round4-counted-state
      TB_STATE_LABEL: counted
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # full history: the freeze checks base_commit is an ancestor of HEAD

      - uses: actions/setup-node@v6
        with:
          node-version: 22   # matches environment_recorded (v22.x); esbuild is lock-pinned, so the artefact is deterministic
          cache: npm

      # Python 3.11 the supported way: ubuntu-latest is now Ubuntu 24.04 (noble),
      # whose apt repos ship 3.12 and have no `python3.11` package. The freeze
      # recorded 3.11.15; the patch is a recorded (drift) field, not binding, so the
      # latest 3.11.x is fine and shows up only as acknowledged environment drift.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The uv the counted tasks were mined with, pinned — same action and version the
      # round4-harness CI job and the pilot use.
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.17'

      - name: Jail dependencies (nftables, iproute2, jq)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 jq
          uv --version
          python3.11 --version
          echo "python3.11 -> $(command -v python3.11)"

      - run: npm ci
      - run: npm run build

      - name: Provision and validate (no trajectory)
        # Single source of truth for "can this host run the counted round". Verifies
        # the toolchain, deploys and pin-verifies the frozen 2.10.3 treatment artefact
        # (derived from the manifest), proves the jail, and runs the counted freeze
        # check — printing the environment-drift fingerprint for review. Runs nothing
        # scientific, needs no credential.
        run: bash harness/taskbench/round4/provision-counted-check.sh

      - name: Restore counted state (never-re-roll across dispatches)
        if: inputs.action != 'check'
        # Ephemeral runners forget runs-counted/ between dispatches, which is where the
        # never-re-roll guarantee and the D36 attempt cap live. Pull the prior markers,
        # verdicts, log and drift acknowledgement so the driver advances in order and
        # halts (rather than re-rolls) a sampled trajectory.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash harness/taskbench/round4/ci-pilot-state.sh restore

      - name: Install the pinned agent CLI where the jail can find it
        if: inputs.action != 'check'
        # run-task4.sh launches the agent inside the jail with
        # PATH=ART_BINDIR:NODE_DIR:VENV/bin:/usr/bin:/bin and calls bare `claude`, so the
        # CLI must resolve in one of those dirs. npm -g on setup-node lands it in NODE_DIR
        # (same prefix as node); symlink it there otherwise. Runs BEFORE any start marker,
        # so a miss is retryable — never a halt. Pinned to the freeze-recorded version
        # (environment_recorded.claude_cli = 2.1.263), so installing it makes that field
        # match the freeze rather than drift.
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code@2.1.263
          NODE_DIR="$(cd "$(dirname "$(command -v node)")" && pwd)"
          CLAUDE="$(command -v claude || true)"
          [ -n "$CLAUDE" ] || { echo "::error::claude not on PATH after install"; exit 1; }
          case "$CLAUDE" in
            "$NODE_DIR"/*|/usr/bin/*|/bin/*) : ;;
            *) sudo ln -sf "$CLAUDE" "$NODE_DIR/claude" 2>/dev/null || ln -sf "$CLAUDE" "$NODE_DIR/claude" ;;
          esac
          echo "agent CLI: $(claude --version 2>&1 | head -1 || true) — reachable at $NODE_DIR/claude"
          # The ACTUAL version is captured into the persisted run record (checkpointed to
          # the state branch with runs-counted/) so the audit trail establishes what
          # executed. Non-binding: counted.yml is outside the frozen set.
          RC="$GITHUB_WORKSPACE/harness/taskbench/round4/runs-counted"; mkdir -p "$RC"
          printf '%s  %s\n' "$(date -u +%FT%TZ)" "$(claude --version 2>&1 | head -1)" >> "$RC/agent-cli-versions.txt"

      - name: Run the counted round (run-next = one trajectory, sweep = the frozen order)
        if: inputs.action != 'check'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ACK: ${{ inputs.acknowledge_env_drift }}
          ACTION: ${{ inputs.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || { echo "::error::needs the CLAUDE_CODE_OAUTH_TOKEN secret."; exit 1; }

          # The jail chains egress through an UPSTREAM HTTP proxy (HTTPS_PROXY). A runner
          # has none, so start a loopback CONNECT forwarder to be it. The jail's own
          # allowlist-proxy still enforces api.anthropic.com-only egress.
          node harness/taskbench/round4/ci-upstream-proxy.mjs 8888 &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            (exec 3<>/dev/tcp/127.0.0.1/8888) 2>/dev/null && { exec 3>&- 3<&-; break; }
            sleep 0.25
          done
          export HTTPS_PROXY=http://127.0.0.1:8888 https_proxy=http://127.0.0.1:8888

          cd harness/taskbench/round4
          # The runner (run-task4.sh) defaults to the PILOT's iteration-1 artefact
          # (/opt/tw-artefact-2.10.2). The counted treatment identity lives in the frozen
          # manifest, so derive it from there (single source) and pass it through every
          # privileged call; counted-drive.sh does not set these inline, so the runner
          # inherits them. Without this the runner looks for the wrong artefact and fails
          # its pre-start pin check.
          TB_ART_DIR=$(jq -r '.treatment.artefact_dir' COUNTED-EXECUTION-MANIFEST.json)
          TB_ART_SHA=$(jq -r '.treatment.artefact_pkg_tree_sha256' COUNTED-EXECUTION-MANIFEST.json)
          { [ -n "$TB_ART_DIR" ] && [ "$TB_ART_DIR" != null ] && [ -n "$TB_ART_SHA" ] && [ "$TB_ART_SHA" != null ]; } \
            || { echo "::error::could not derive treatment artefact from COUNTED-EXECUTION-MANIFEST.json"; exit 1; }
          echo "treatment artefact: $TB_ART_DIR @ $TB_ART_SHA"
          export TB_ART_DIR TB_ART_SHA

          # Every privileged call carries the runner PATH, the upstream proxy, TB_NETJAIL,
          # the derived treatment and the token, so the freeze fingerprint and the agent
          # network path are identical across the code check, the acknowledgement and the
          # driver's own gate. The counted driver derives its manifest, pool (pools/counted/
          # tasks) and runs dir from its own location, so those need no override here.
          run() { sudo -E env "PATH=$PATH" HTTPS_PROXY="$HTTPS_PROXY" https_proxy="$https_proxy" TB_NETJAIL=1 TB_ART_DIR="$TB_ART_DIR" TB_ART_SHA="$TB_ART_SHA" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" "$@"; }

          # Checkpoint after EACH trajectory: hand the sudo-written runs-counted/ files back
          # to the runner and force-push the snapshot to the state branch. On an ephemeral
          # runner this means a mid-sweep death loses at most the in-flight trajectory.
          checkpoint() {
            sudo chown -R "$(id -u):$(id -g)" runs-counted 2>/dev/null || true
            sudo chmod -R u+rwX runs-counted 2>/dev/null || true
            GITHUB_TOKEN="$GITHUB_TOKEN" bash "$GITHUB_WORKSPACE/harness/taskbench/round4/ci-pilot-state.sh" save
          }

          # Acknowledge environment drift once; the acknowledgement persists in runs-counted/
          # for the whole sweep (the runner's fingerprint does not change mid-job).
          set +e; run node freeze-counted-manifest.mjs --check >/tmp/fz.txt 2>&1; FRC=$?; set -e
          cat /tmp/fz.txt
          case "$FRC" in
            0) : ;;
            3)
              [ "$ACK" = "true" ] || { echo "::error::environment drift is unacknowledged. Review the fingerprint from a check run, then re-dispatch with acknowledge_env_drift: true."; exit 1; }
              run ./counted-drive.sh --acknowledge-drift ;;
            *) echo "::error::freeze exit $FRC — not runnable (binding/structural drift is never acknowledged)."; exit 1 ;;
          esac

          # CREDENTIAL PREFLIGHT (positive control): before dispatching ANY trajectory,
          # prove the provisioned credential can obtain a genuine model completion —
          # through the same credential resolution, claude CLI, registered model and proxy
          # egress route as a real dispatch, with a trivial non-task prompt, in a throwaway
          # workdir that touches no trajectory state. A malformed, revoked or unprovisioned
          # token fails HERE and burns nothing, instead of a real trajectory recording a
          # fabricated non-run.
          PF_MODEL=$(jq -r '.registration.model' COUNTED-EXECUTION-MANIFEST.json)
          set +e; run bash "$GITHUB_WORKSPACE/harness/taskbench/runner/preflight-auth.sh" "$PF_MODEL" >/tmp/pf.txt 2>&1; PFRC=$?; set -e
          cat /tmp/pf.txt
          [ "$PFRC" = 0 ] || { echo "::error::credential preflight failed (rc=$PFRC) — the provisioned CLAUDE_CODE_OAUTH_TOKEN cannot obtain a real model completion. Store it as a single unbroken line and re-dispatch. No trajectory was dispatched, nothing consumed."; exit 1; }

          # The sweep: run trajectories in frozen order, resume by rerun (done/adjudicated
          # ones are skipped by the driver), checkpoint after each, and stop cleanly on
          # complete / halt / failure. `run-next` does exactly one. The time budget stops
          # STARTING a new trajectory ~285 min in so the last one finishes under the
          # 350-min job timeout; re-dispatching resumes.
          T0=$(date +%s); STOP_AFTER=$(( 285*60 )); n=0; rc_final=0
          while :; do
            set +e; run ./counted-drive.sh --next >/tmp/next.txt 2>&1; RC=$?; set -e
            cat /tmp/next.txt
            if grep -q 'every trajectory is accounted for' /tmp/next.txt; then
              echo "COUNTED ROUND COMPLETE — every trajectory is accounted for"; break
            fi
            checkpoint; n=$((n+1))
            if [ "$RC" = 3 ]; then echo "::warning::HALTED after $n — a sampled trajectory (or an exhausted D36 replacement) needs adjudication; stopping."; rc_final=3; break; fi
            if [ "$RC" != 0 ]; then echo "::error::a trajectory failed (rc=$RC) after $n; stopping."; rc_final="$RC"; break; fi
            [ "$ACTION" = "sweep" ] || break
            if [ $(( $(date +%s) - T0 )) -gt "$STOP_AFTER" ]; then
              echo "::warning::time budget reached after $n trajectories; stopping cleanly — re-dispatch sweep to resume."; break
            fi
          done

          echo "### counted status" >> "$GITHUB_STEP_SUMMARY"
          run ./counted-drive.sh --status | tee -a "$GITHUB_STEP_SUMMARY" || true
          exit "$rc_final"

      - name: Normalize runs-counted ownership
        # run-task4 runs under sudo, so runs-counted/ files — including the root-only
        # verdict.json — are root-owned. Hand them back to the runner user (ALWAYS, so a
        # halt state persists too) before the state save and the artifact upload, which
        # run as the runner user. Without this the verdict is silently dropped from the
        # snapshot and the upload fails with EACCES.
        if: always() && inputs.action != 'check'
        run: |
          D=harness/taskbench/round4/runs-counted
          if [ -d "$D" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$D"
            sudo chmod -R u+rwX "$D"
          fi

      - name: Save counted state
        # ALWAYS: a produced verdict or a written start marker must persist to the next
        # dispatch — that is what makes never-re-roll hold on an ephemeral runner. Runs
        # even when the trajectory failed.
        if: always() && inputs.action != 'check'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash harness/taskbench/round4/ci-pilot-state.sh save

      - name: Upload the trajectory record
        if: always() && inputs.action != 'check'
        uses: actions/upload-artifact@v5
        with:
          name: counted-runs
          path: |
            harness/taskbench/round4/runs-counted/
          retention-days: 30
          if-no-files-found: ignore
