name: diag-07-gepa

# THROWAWAY read-only diagnostic (D41 step 3) — reproduce the frozen P/R qualification
# of counted task 07-gepa-ai-gepa on a GitHub Actions runner, open-net (the counted
# pre-agent baseline suite in run-task4.sh runs on the host with open network, no
# net-jail, so open-net GHA is the faithful pre-sampling qualification environment).
# No credential, no model sampling, no task/harness/probe edits: it clones the frozen
# parent, runs the frozen install ladder + suite command, applies the frozen test
# patch, and runs the suite again TWICE capturing full output to characterise the
# pytest rc and prove determinism. Triggers only on push to this throwaway branch, so
# it never touches main. Delete the branch after reading the run.
on:
  push:
    branches: [sec/round4-diag-07]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.17'
      - name: Read-only P/R diagnosis of 07-gepa (frozen procedure, open-net, no credential)
        run: |
          set -uo pipefail
          MF="$PWD/harness/taskbench/round4/pools/counted/tasks/07-gepa-ai-gepa"
          REPO=$(node -p "require('$MF/manifest.json').repo")
          PSHA=$(node -p "require('$MF/manifest.json').parent_sha")
          echo "task=07-gepa-ai-gepa repo=$REPO parent=$PSHA"
          echo "network: OPEN (matches census + counted pre-agent baseline suite)"
          echo "runner: $ImageOS $ImageVersion ; $(python3.11 --version) ; $(uv --version) ; $(node --version)"
          D="$RUNNER_TEMP/repo"; V="$RUNNER_TEMP/venv"
          git clone -q --filter=blob:none "https://github.com/$REPO" "$D"
          git -C "$D" checkout -q --detach "$PSHA"
          uv venv -q -p python3.11 "$V"; PY="$V/bin/python"
          ( cd "$D" && timeout 300 uv pip install -q -p "$PY" -e ".[test]" ) && echo "install extras:test OK" || echo "install rc=$?"
          uv pip install -q -p "$PY" pytest >/dev/null 2>&1
          run_suite() { ( cd "$D" && timeout 300 "$PY" -m pytest -q -p no:cacheprovider ) >"$1" 2>&1; echo $?; }

          echo "===== P — untouched parent (frozen suite cmd) ====="
          PRC=$(run_suite "$RUNNER_TEMP/P.out"); echo "P rc=$PRC"
          tail -3 "$RUNNER_TEMP/P.out"

          echo "===== apply frozen test.patch ====="
          git -C "$D" apply --whitespace=nowarn "$MF/test.patch" && echo "test.patch applied" || { echo "test.patch FAILED"; exit 1; }

          echo "===== R run 1 — parent+tests (frozen suite cmd) ====="
          R1=$(run_suite "$RUNNER_TEMP/R1.out"); echo "R1 rc=$R1"
          echo "===== R run 2 — determinism ====="
          R2=$(run_suite "$RUNNER_TEMP/R2.out"); echo "R2 rc=$R2"

          echo "===== VERDICT SIGNALS ====="
          echo "P rc=$PRC  R1 rc=$R1  R2 rc=$R2  (frozen classifier: 0=GREEN 1=RED 3=HARNESS_ERROR)"
          echo "R1 INTERNALERROR lines: $(grep -c 'INTERNALERROR' "$RUNNER_TEMP/R1.out" || true)"
          echo "R2 INTERNALERROR lines: $(grep -c 'INTERNALERROR' "$RUNNER_TEMP/R2.out" || true)"
          echo "R1 WindowsPath signature:"; grep -m1 -E "cannot instantiate 'WindowsPath'|NotImplementedError" "$RUNNER_TEMP/R1.out" || echo "  (none)"

          echo "===== R1 tail (traceback) ====="
          tail -45 "$RUNNER_TEMP/R1.out"
