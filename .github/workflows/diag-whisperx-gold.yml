name: diag-whisperx-gold
# THROWAWAY, read-only diagnostic for counted seq 121 (96-m-bain-whisperx / gated),
# which hit PRE_AGENT_GOLD_RED twice (attempt 1 deep in a dispatch, attempt 2 as the
# first trajectory of a fresh dispatch) — D36 exhausted. It reproduces run-task4's
# EXACT pre-agent gold-check path (via diag/whisperx-goldpath.sh) after the same
# counted provisioning as counted.yml, on 3 independent fresh runners, and PRESERVES
# the suite output run-task4 discards. No Claude credential, no model sampling, no
# counted-state mutation, no net-jail (the pre-agent baseline runs open-net). Not
# for merge.
on:
  push:
    branches: [sec/round4-diag-121-whisperx]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  goldpath:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.17'
      - name: Jail dependencies (nftables, iproute2, jq)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 jq
      - run: npm ci
      - run: npm run build
      - name: Provision and validate (no trajectory) — same as counted.yml
        run: bash harness/taskbench/round4/provision-counted-check.sh
      - name: Exact run-task4 gold-check path (fresh runner #${{ matrix.run }}, output preserved)
        run: |
          set +e
          echo "======== FRESH RUNNER #${{ matrix.run }} of 3 — exact run-task4 gold-check path ========"
          bash diag/whisperx-goldpath.sh 96-m-bain-whisperx gated
          echo "SCRIPT_EXIT=$?"
