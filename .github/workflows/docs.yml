name: docs

# Builds the VitePress site under docs/ and deploys it to GitHub Pages
# (hexrift.github.io/tamperward). Docs only — nothing here touches the npm package,
# the release pipeline, or the gate.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write # deploy to Pages
  id-token: write # OIDC token for the Pages deployment

# One deploy at a time; never cancel a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitepress build docs
      - name: Smoke-test the rendered site
        run: node .github/docs/docs-smoke.mjs docs/.vitepress/dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
