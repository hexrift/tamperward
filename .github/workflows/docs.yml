name: docs

# Builds the VitePress site under docs/ and deploys it to GitHub Pages
# (hexrift.github.io/tamperward). Docs only — nothing here touches the npm package,
# the release pipeline, or the gate.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read
  pages: write # deploy to Pages
  id-token: write # OIDC token for the Pages deployment

# One deploy at a time; never cancel a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitepress build docs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
