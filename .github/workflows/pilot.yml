name: pilot

# Round-4 pilot trajectory runner — MANUAL, non-required, never on push.
#
# It runs ONE frozen trajectory (`pilot-drive.sh --next`, which takes the lowest
# unfinished seq — seq 1 is `15-pydata-numexpr` / gated). A trajectory that
# STARTS is never re-rolled, so dispatching `run-next` is a deliberate, one-way
# act. `check` (the default) provisions the host and validates the freeze but
# runs no trajectory.
#
# This is NOT one of the required checks in ci.yml. Like harness.yml it costs real
# model usage and must never gate a merge.
#
# WHY A GITHUB RUNNER WORKS. `ubuntu-latest` is a privileged Linux VM: `iproute2`
# and `nftables` are available and the runner has `sudo`, so `net-jail.sh` builds
# the netns + veth + nftables egress jail the pilot needs (proven: net-jail.sh
# selftest passes). The registered agent authenticates with the OAuth token as a
# secret and reaches api.anthropic.com through the jail's allowlist proxy — the
# same path round 3.1 recorded.
#
# ENVIRONMENT DRIFT IS EXPECTED AND HANDLED IN TWO PHASES. A runner is not the
# frozen firecracker host, so `freeze-pilot-manifest.mjs` reports ENVIRONMENT
# drift (exit 3) — acknowledgeable, unlike BINDING drift (exit 2), which fails
# hard here and is never acknowledged. Phase 1: dispatch `check`; it prints the
# exact drift fingerprint and stops. Review it. Phase 2: dispatch `run-next` with
# `acknowledge_env_drift: true`; the run records that exact fingerprint and
# proceeds. Also record the drift in DEVIATIONS.md — the acknowledgement lets the
# driver proceed; the ledger is the scientific record.
#
# SAFETY. `run-task4.sh` writes its trajectory-start marker only AFTER the jail is
# up, the gate-liveness probe passes and the agent is about to launch. Any failure
# in provisioning, the jail, or the freeze happens BEFORE that marker, so it does
# not burn seq 1 — it is cleanly retryable. Only a failure once the agent has
# started is a real, non-re-rollable outcome that halts the driver for human
# adjudication.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check (provision + freeze, runs nothing) | run-next (ONE trajectory) | sweep (all remaining, in frozen order, checkpointing each)'
        type: choice
        options: [check, run-next, sweep]
        default: check
      acknowledge_env_drift:
        description: 'run-next / sweep — record the environment drift and proceed. Review the fingerprint from a `check` run first.'
        type: boolean
        default: false

permissions:
  contents: write   # run-next force-pushes the runs-pilot/ snapshot to a non-protected state branch

concurrency:
  group: round4-pilot        # one pilot run at a time, ever
  cancel-in-progress: false

jobs:
  trajectory:
    runs-on: ubuntu-latest
    # A single trajectory needs ~65 min worst case (≤50-min agent budget + provisioning).
    # `sweep` runs many back-to-back in one job, checkpointing after each, and stops
    # starting new trajectories ~285 min in (see STOP_AFTER) so the last one finishes
    # well under this ceiling; anything unfinished is resumed by re-dispatching sweep.
    # 350 stays under GitHub's 6 h hard cap while leaving that headroom.
    timeout-minutes: 350
    env:
      # Iteration-2 execution records go to their OWN state branch, so iteration-1
      # runs (on round4-pilot-state) and iteration-2 runs never mix. This is
      # ISOLATION PLUMBING — the checkpoint target read by ci-pilot-state.sh; it is
      # NOT in the frozen binding set and touches no treatment, driver, runner or
      # adjudicator. Update it when a new iteration is armed.
      TB_PILOT_STATE_BRANCH: round4-pilot-i2-state
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0     # full history: the freeze checks base_commit is an ancestor of HEAD

      - uses: actions/setup-node@v6
        with:
          node-version: 22   # matches environment_recorded (v22.x); esbuild is lock-pinned, so the artefact is deterministic
          cache: npm

      # Python 3.11 the supported way: ubuntu-latest is now Ubuntu 24.04 (noble),
      # whose apt repos ship 3.12 and have no `python3.11` package. The freeze
      # recorded 3.11.15; the patch is a recorded (drift) field, not binding, so the
      # latest 3.11.x is fine and shows up only as acknowledged environment drift.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The uv the pilot tasks were mined with, pinned — same action and version the
      # round4-harness CI job uses.
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.17'

      - name: Jail dependencies (nftables, iproute2, jq)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 jq
          uv --version
          python3.11 --version
          echo "python3.11 -> $(command -v python3.11)"

      - run: npm ci
      - run: npm run build

      - name: Provision and validate (no trajectory)
        # Single source of truth, also run by ci.yml's `pilot-provisioning` job so a
        # runner-image / package / action regression fails a PR rather than a manual
        # dispatch. Verifies the toolchain, deploys and pin-verifies the artefact,
        # proves the jail, and runs the freeze check — printing the environment-drift
        # fingerprint for review. Runs nothing scientific.
        run: bash harness/taskbench/round4/provision-check.sh

      - name: Restore pilot state (never-re-roll across dispatches)
        if: inputs.action != 'check'
        # Ephemeral runners forget runs-pilot/ between dispatches, which is where the
        # never-re-roll guarantee lives. Pull the prior markers/verdicts so the driver
        # advances in order and halts (rather than re-rolls) a started trajectory.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash harness/taskbench/round4/ci-pilot-state.sh restore

      - name: Install the pinned agent CLI where the jail can find it
        if: inputs.action != 'check'
        # run-task4.sh launches the agent inside the jail with
        # PATH=ART_BINDIR:NODE_DIR:VENV/bin:/usr/bin:/bin and calls bare `claude`, so the
        # CLI must resolve in one of those dirs. npm -g on setup-node lands it in NODE_DIR
        # (same prefix as node); symlink it there otherwise. Runs BEFORE the start marker,
        # so a miss is retryable — never a halt. Pinned to the freeze-recorded version.
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code@2.1.260
          NODE_DIR="$(cd "$(dirname "$(command -v node)")" && pwd)"
          CLAUDE="$(command -v claude || true)"
          [ -n "$CLAUDE" ] || { echo "::error::claude not on PATH after install"; exit 1; }
          case "$CLAUDE" in
            "$NODE_DIR"/*|/usr/bin/*|/bin/*) : ;;
            *) sudo ln -sf "$CLAUDE" "$NODE_DIR/claude" 2>/dev/null || ln -sf "$CLAUDE" "$NODE_DIR/claude" ;;
          esac
          echo "agent CLI: $(claude --version 2>&1 | head -1 || true) — reachable at $NODE_DIR/claude"
          # The iteration-2 freeze recorded claude_cli:null (derived in the mining
          # container, which has no Claude CLI). The execution path pins 2.1.260, so
          # the ACTUAL version is captured HERE, into the persisted run record, so the
          # audit trail establishes what executed (checkpointed to the state branch
          # with runs-pilot/). Non-binding: pilot.yml is outside the frozen set.
          RP="$GITHUB_WORKSPACE/harness/taskbench/round4/runs-pilot"; mkdir -p "$RP"
          printf '%s  %s\n' "$(date -u +%FT%TZ)" "$(claude --version 2>&1 | head -1)" >> "$RP/agent-cli-versions.txt"

      - name: Run the pilot (run-next = one trajectory, sweep = the frozen order)
        if: inputs.action != 'check'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ACK: ${{ inputs.acknowledge_env_drift }}
          ACTION: ${{ inputs.action }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || { echo "::error::needs the CLAUDE_CODE_OAUTH_TOKEN secret."; exit 1; }

          # The jail chains egress through an UPSTREAM HTTP proxy (HTTPS_PROXY). A runner
          # has none, so start a loopback CONNECT forwarder to be it. The jail's own
          # allowlist-proxy still enforces api.anthropic.com-only egress.
          node harness/taskbench/round4/ci-upstream-proxy.mjs 8888 &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            (exec 3<>/dev/tcp/127.0.0.1/8888) 2>/dev/null && { exec 3>&- 3<&-; break; }
            sleep 0.25
          done
          export HTTPS_PROXY=http://127.0.0.1:8888 https_proxy=http://127.0.0.1:8888

          cd harness/taskbench/round4
          # The runner (run-task4.sh) is treatment-AGNOSTIC: it pins whatever artefact
          # TB_ART_DIR/TB_ART_SHA name, defaulting to iteration 1's 2.10.2. The treatment
          # identity lives in the frozen registration, so derive it from there (single
          # source) and pass it through every privileged call. Without this the runner
          # looks for the wrong artefact and fails the pre-start pin check (exit 7).
          ACT_ITER=$(jq -r '.active_iteration' PILOT-REGISTRATION.json)
          TB_ART_DIR=$(jq -r --argjson a "$ACT_ITER" '.iterations[]|select(.iteration==$a)|.treatment_artefact_dir' PILOT-REGISTRATION.json)
          TB_ART_SHA=$(jq -r --argjson a "$ACT_ITER" '.iterations[]|select(.iteration==$a)|.treatment_artefact_sha256' PILOT-REGISTRATION.json)
          [ -n "$TB_ART_DIR" ] && [ "$TB_ART_DIR" != null ] && [ -n "$TB_ART_SHA" ] && [ "$TB_ART_SHA" != null ] \
            || { echo "::error::could not derive treatment artefact for active iteration $ACT_ITER from PILOT-REGISTRATION.json"; exit 1; }
          echo "treatment artefact (iteration $ACT_ITER): $TB_ART_DIR @ $TB_ART_SHA"
          export TB_ART_DIR TB_ART_SHA
          # Same story for the POOL: run-task4.sh defaults TASK to iteration 1's
          # pools/pilot/tasks. Point it at the directory holding THIS iteration's frozen
          # ten, identified by matching the registration's task ids (not a name guess),
          # so a renamed pool layout can never silently resolve to the wrong tasks.
          mapfile -t POOL_IDS < <(jq -r --argjson a "$ACT_ITER" '.iterations[]|select(.iteration==$a)|.pool[]' PILOT-REGISTRATION.json)
          [ "${#POOL_IDS[@]}" -gt 0 ] || { echo "::error::registration has no pool for iteration $ACT_ITER"; exit 1; }
          TB_TASKS=""
          for d in pools/*/tasks; do
            [ -d "$d" ] || continue
            miss=0
            for id in "${POOL_IDS[@]}"; do [ -f "$d/$id/manifest.json" ] || { miss=1; break; }; done
            if [ "$miss" = 0 ]; then TB_TASKS="$PWD/$d"; break; fi
          done
          [ -n "$TB_TASKS" ] || { echo "::error::no pool directory under pools/*/tasks contains all ${#POOL_IDS[@]} frozen tasks for iteration $ACT_ITER"; exit 1; }
          echo "pool directory (iteration $ACT_ITER): $TB_TASKS"
          export TB_TASKS
          # Every privileged call carries the runner PATH, the upstream proxy, TB_NETJAIL and
          # the token, so the freeze fingerprint and the agent network path are identical
          # across the code check, the acknowledgement and the driver's own gate.
          run() { sudo -E env "PATH=$PATH" HTTPS_PROXY="$HTTPS_PROXY" https_proxy="$https_proxy" TB_NETJAIL=1 TB_ART_DIR="$TB_ART_DIR" TB_ART_SHA="$TB_ART_SHA" TB_TASKS="$TB_TASKS" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" "$@"; }

          # H5-style checkpoint after EACH trajectory: hand the sudo-written runs-pilot/ files
          # back to the runner and force-push the snapshot to the state branch. On an
          # ephemeral runner this means a mid-sweep death loses at most the in-flight
          # trajectory — round 3 lost eight pairs to exactly this failure mode.
          checkpoint() {
            sudo chown -R "$(id -u):$(id -g)" runs-pilot 2>/dev/null || true
            sudo chmod -R u+rwX runs-pilot 2>/dev/null || true
            GITHUB_TOKEN="$GITHUB_TOKEN" bash "$GITHUB_WORKSPACE/harness/taskbench/round4/ci-pilot-state.sh" save
          }

          # Acknowledge environment drift once; the acknowledgement persists in runs-pilot/
          # for the whole sweep (the runner's fingerprint does not change mid-job).
          set +e; run node freeze-pilot-manifest.mjs --check >/tmp/fz.txt 2>&1; FRC=$?; set -e
          cat /tmp/fz.txt
          case "$FRC" in
            0) : ;;
            3)
              [ "$ACK" = "true" ] || { echo "::error::environment drift is unacknowledged. Review the fingerprint from a check run, then re-dispatch with acknowledge_env_drift: true."; exit 1; }
              run ./pilot-drive.sh --acknowledge-drift ;;
            *) echo "::error::freeze exit $FRC — not runnable (binding/structural drift is never acknowledged)."; exit 1 ;;
          esac

          # The sweep, following the round-3.1 driver's process: run trajectories in frozen
          # order, resume by rerun (done/adjudicated ones are skipped by the driver),
          # checkpoint after each, and stop cleanly on complete / halt / failure. `run-next`
          # does exactly one. The time budget stops STARTING a new trajectory ~285 min in so
          # the last one finishes under the 350-min job timeout; re-dispatching resumes.
          T0=$(date +%s); STOP_AFTER=$(( 285*60 )); n=0; rc_final=0
          while :; do
            set +e; run ./pilot-drive.sh --next >/tmp/next.txt 2>&1; RC=$?; set -e
            cat /tmp/next.txt
            if grep -q 'every trajectory is accounted for' /tmp/next.txt; then
              echo "PILOT COMPLETE — every trajectory is accounted for"; break
            fi
            checkpoint; n=$((n+1))
            if [ "$RC" = 3 ]; then echo "::warning::HALTED after $n — a started trajectory needs adjudication; stopping."; rc_final=3; break; fi
            if [ "$RC" != 0 ]; then echo "::error::a trajectory failed (rc=$RC) after $n; stopping."; rc_final="$RC"; break; fi
            [ "$ACTION" = "sweep" ] || break
            if [ $(( $(date +%s) - T0 )) -gt "$STOP_AFTER" ]; then
              echo "::warning::time budget reached after $n trajectories; stopping cleanly — re-dispatch sweep to resume."; break
            fi
          done

          echo "### pilot status" >> "$GITHUB_STEP_SUMMARY"
          ./pilot-drive.sh --status | tee -a "$GITHUB_STEP_SUMMARY" || true
          exit "$rc_final"

      - name: Normalize runs-pilot ownership
        # run-task4 runs under sudo, so runs-pilot/ files — including the root-only
        # verdict.json — are root-owned. Hand them back to the runner user (ALWAYS, so a
        # halt state persists too) before the state save and the artifact upload, which
        # run as the runner user. Without this the verdict is silently dropped from the
        # snapshot and the upload fails with EACCES.
        if: always() && inputs.action != 'check'
        run: |
          D=harness/taskbench/round4/runs-pilot
          if [ -d "$D" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$D"
            sudo chmod -R u+rwX "$D"
          fi

      - name: Save pilot state
        # ALWAYS: a produced verdict or a written start marker must persist to the next
        # dispatch — that is what makes never-re-roll hold on an ephemeral runner. Runs
        # even when the trajectory failed.
        if: always() && inputs.action != 'check'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash harness/taskbench/round4/ci-pilot-state.sh save

      - name: Upload the trajectory record
        if: always() && inputs.action != 'check'
        uses: actions/upload-artifact@v5
        with:
          name: pilot-runs
          path: |
            harness/taskbench/round4/runs-pilot/
          retention-days: 30
          if-no-files-found: ignore
