name: release

# RELEASES ARE VERSION-DRIVEN, NOT TAG-DRIVEN. On every push to main, the version in
# package.json is compared against the registry: if the registry does not have it, this
# workflow publishes it and THEN creates the tag and GitHub release as the record of what
# shipped. Merging a version-bump PR is the release act — protected by the same branch
# rules as any other merge. A merge that does not change the version is a no-op here.
#
# Why not tags: a tag push was a second, manual, out-of-band step (and some environments
# cannot push tags at all). It also inverted the record: the tag asserted what WOULD be
# published, rather than recording what WAS. Order here is publish first, tag on success —
# a failed publish leaves no tag behind. Tags created by GITHUB_TOKEN do not trigger
# workflows, which is fine: nothing hangs off tags any more.
#
# Publishing runs from CI, never a laptop: that is what lets npm attach PROVENANCE — a
# signed, verifiable link from the published tarball back to this repo, this commit, and
# this workflow. For a tool whose whole claim is verifiable integrity, publishing without
# it would be off-message.
#
# RE-ENTRANT (#420). Publish, tag and release are three separate records, and each step
# is gated on ITS OWN record being absent — the registry for publish, `git ls-remote` for
# the tag, `gh release view` for the release — never on whether an earlier step ran in
# this particular run. A run that published and then failed to push the tag converges
# on re-run: publish is skipped, the tag and release are created. Gating all three on
# "the registry lacks it" (as this file once did) made that state permanent.
on:
  push:
    branches: [main]
  workflow_dispatch: # re-run a failed release for the same version; the per-record guards make it idempotent
    inputs:
      allow_non_bump_head:
        description: >-
          Publish even though HEAD is not the commit that last changed package.json.
          The tag and provenance will point at HEAD, which carries changes the
          CHANGELOG entry for this version does not describe. Off by default.
        type: boolean
        default: false

# No NPM_TOKEN. Authentication is npm TRUSTED PUBLISHING: npm trusts this repository's
# workflow directly, and GitHub mints a short-lived OIDC credential per run. The trust
# relationship is configured on npmjs.com (Package -> Settings -> Trusted publishing) and
# matches this file by FILENAME — rename release.yml and publishing stops until that
# entry is updated to match.
permissions:
  contents: write # create the tag + GitHub release after a successful publish
  id-token: write # mints the OIDC token npm exchanges for publish rights

# One release at a time, and never cancel one mid-publish: a cancelled run could leave a
# published version with no tag. Queued runs re-check the registry and no-op.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # `workflow_dispatch` exists to re-run a failed release, and a dispatch can name ANY
    # ref. Without this guard a feature branch whose package.json carries a forward
    # version publishes with provenance pointing at an unreviewed commit; the
    # forward-version check below cannot tell that branch from main. Main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history and tags, not the default depth-1 checkout. Two things below need
      # them: `plan` asks which commit last touched package.json, which on a depth-1
      # clone is trivially HEAD and the check is vacuous; and the release notes look up
      # the previous v* tag for the "Full Changelog" compare link, which on a tagless
      # clone was always empty, so the link was never written (#420).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # NO registry-url. Setting it makes setup-node write an .npmrc containing
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and with no NODE_AUTH_TOKEN in the environment that expands to an EMPTY token.
      # npm then sees auth already configured, takes the token path, never attempts the
      # OIDC exchange, and the publish fails as an unauthenticated write — reported as
      # E404, because the registry will not disclose whether a package exists to a caller
      # lacking rights. That is exactly how the v1.1.0-rc.1 release failed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Node's bundled npm lags what trusted publishing needs — upgrade explicitly rather
      # than depending on whatever the Node line happens to bundle, which changes under us.
      # Pinned, not `@latest`: this npm runs `npm ci`, the build and the publish itself,
      # so whichever npm is `latest` at release time would otherwise be part of the
      # supply chain with no review. Bump it deliberately.
      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@12.0.2

      # Verify it rather than assume the upgrade worked: without this the publish fails
      # later with an auth error that looks like a credentials problem.
      - name: npm must support trusted publishing
        run: |
          set -euo pipefail
          NPM_V="$(npm --version)"
          echo "npm $NPM_V, node $(node --version)"
          node -e '
            const [a,b,c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " is older than 11.5.1; trusted publishing needs 11.5.1+"); process.exit(1); }
          ' "$NPM_V"

      # The release plan. Three independent questions, one output each:
      #   publish         — does the registry lack this version? Exit 0 from
      #                     `npm view pkg@version` means it has it -> nothing to publish.
      #   tag_missing     — does origin lack refs/tags/v<version>?
      #   release_missing — does GitHub lack a release named v<version>?
      # Each later step keys on its own answer, so a partial earlier run converges here
      # instead of being frozen by "already on the registry".
      #
      # If the registry check fails TRANSIENTLY (network), we proceed and the publish
      # itself fails loudly on the conflict — a wasted run, never a wrong publish: the
      # registry rejects overwrites. The tag check is the opposite shape: `ls-remote`
      # failing is a hard error (set -e), because "could not ask" must not be read as
      # "absent" and produce a second tag push that the ruleset then rejects.
      #
      # BUMP-COMMIT CHECK (#420). This workflow fires on every push to main and publishes
      # whatever HEAD is. If the release of the bump commit failed and the next merge is
      # an unrelated change, that later push would publish the unrelated commit under
      # the reviewed version: provenance and the tag then point at code the CHANGELOG
      # entry never described. So when there is anything to do, HEAD must be the commit
      # that last changed package.json — the bump commit that review approved — unless
      # a `workflow_dispatch` says `allow_non_bump_head: true`, which makes the
      # divergence a conscious act with both SHAs in the log. When there is nothing to
      # do (already published, tagged and released) the check is skipped, so ordinary
      # non-bump merges stay a quiet no-op.
      - name: Decide whether this push releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_NON_BUMP_HEAD: ${{ inputs.allow_non_bump_head || 'false' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "tamperward@${VERSION}" version >/dev/null 2>&1; then
            echo "tamperward@${VERSION} is already on the registry — not publishing."
            PUBLISH=false
          else
            echo "tamperward@${VERSION} is not on the registry — publishing it."
            PUBLISH=true
          fi
          if [ -z "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "origin has no tag v${VERSION} — it will be created."
            TAG_MISSING=true
          else
            echo "origin already has tag v${VERSION}."
            TAG_MISSING=false
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists."
            RELEASE_MISSING=false
          else
            echo "GitHub release v${VERSION} does not exist — it will be created."
            RELEASE_MISSING=true
          fi
          BUMP_SHA="$(git log -1 --format=%H -- package.json)"
          echo "bump commit (last to touch package.json): ${BUMP_SHA}"
          echo "head commit (GITHUB_SHA):                  ${GITHUB_SHA}"
          if [ "$PUBLISH" = true ] || [ "$TAG_MISSING" = true ] || [ "$RELEASE_MISSING" = true ]; then
            if [ "$BUMP_SHA" != "$GITHUB_SHA" ]; then
              if [ "$ALLOW_NON_BUMP_HEAD" = "true" ]; then
                echo "::warning::HEAD ${GITHUB_SHA} is not the bump commit ${BUMP_SHA}; proceeding because allow_non_bump_head=true. The tag and provenance for v${VERSION} will point at HEAD."
              else
                echo "::error::HEAD ${GITHUB_SHA} is not the commit that last changed package.json (${BUMP_SHA}). Publishing it would ship changes the CHANGELOG entry for ${VERSION} never described. Re-run via workflow_dispatch with allow_non_bump_head=true to publish HEAD deliberately, or bump the version in a new PR."
                exit 1
              fi
            fi
          fi
          {
            echo "publish=${PUBLISH}"
            echo "tag_missing=${TAG_MISSING}"
            echo "release_missing=${RELEASE_MISSING}"
            echo "version=${VERSION}"
            echo "bump_sha=${BUMP_SHA}"
          } >> "$GITHUB_OUTPUT"

      # Install (which the forward-version guard below needs), typecheck, then publish.
      # prepublishOnly builds dist/.
      #
      # NO `npm test` HERE, deliberately (#420). The exact-head PR CI (ci.yml, required
      # on every merge to main) already ran the whole suite on Node 20/22/24 for this
      # very commit; a second run on the release runner adds no evidence about the code
      # and adds one more place for a timing-sensitive test to fail. That is how 2.23.0
      # sat unpublished: the perf-smoke (then test/perf-smoke.test.ts, now
      # harness/perf/smoke.test.ts in its own ci.yml job) measures a throughput ratio,
      # and the release runner's ratio missed the bar the PR runner had cleared. A test that
      # passed on the reviewed head and fails on the release runner tells us about the
      # runner, not the release — and the bump-commit check in `plan` is what guarantees
      # the head being published IS the reviewed head. The typecheck stays: it is
      # deterministic, cheap, and catches a broken toolchain before `npm publish` does.
      - if: steps.plan.outputs.publish == 'true'
        run: npm ci

      # A typo in a version-bump PR must not move `latest` BACKWARDS. npm points `latest`
      # at whatever `--tag latest` publishes, even a LOWER version — so 1.0.2 published
      # after 1.1.0 would hand every fresh `npm install` the older code, with six green
      # checks and nothing comparing against what is already out. New versions must move
      # forward: a stable release must exceed the current `latest`; a prerelease must
      # exceed the current `next` as well. A stable is deliberately NOT compared against
      # `next` — shipping a 1.x stable while a 2.0 rc sits on `next` is legitimate.
      # `includePrerelease` is load-bearing: without it semver ranges exclude
      # prereleases and `1.2.0-rc.1 > 1.1.0` would wrongly fail. Backporting to an old
      # line would need this loosened; that is a problem to design for when it exists.
      #
      # The comparison runs on the `semver` devDependency that `npm ci` just installed
      # from the lockfile (exact version, integrity-checked) — NOT an `npx`-fetched
      # semver, which pulled an unreviewed tarball from the registry inside the very job that
      # pins npm itself so nothing at publish time is fetched without review (#423).
      # This job's registry traffic is now `npm ci` against the lock, the forward-version
      # guard's read-only `npm view` lookups (#548), and the publish itself — no
      # unreviewed code is fetched.
      - name: Version must move forward
        if: steps.plan.outputs.publish == 'true'
        # A registry lookup FAILURE must not be mistaken for an absent tag: the
        # helper (unit-tested in test/release-forward-guard.test.ts) classifies
        # each `npm view` as present / absent / failure, retries bounded transient
        # failures, and stops the release rather than skip the guard (#548). It
        # keeps the stable-vs-`next` comparison semantics of the old inline check.
        run: node .github/scripts/forward-guard.mjs "${{ steps.plan.outputs.version }}"

      - if: steps.plan.outputs.publish == 'true'
        run: npm run typecheck

      # A prerelease must not become `latest`, or `npm install tamperward` starts handing
      # people a release candidate. Anything with a hyphen (1.1.0-rc.2) publishes under
      # the `next` dist-tag instead.
      - name: Publish
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          case "$VERSION" in
            *-*) echo "prerelease $VERSION -> dist-tag next"; TAG=next ;;
            *)   echo "release $VERSION -> dist-tag latest";  TAG=latest ;;
          esac
          npm publish --provenance --access public --tag "$TAG"

      # The tag is the RECORD, cut only after the registry accepted the publish — either
      # in this run (the Publish step above succeeded, or the job would have stopped) or
      # in an earlier one (publish=false because the registry already has the version).
      # Gated on the tag being ABSENT FROM ORIGIN, not on `publish`, so a run that
      # published and then failed here is repaired by re-running. The tag ruleset
      # (release tags) forbids deleting or moving v* tags, so the record is append-only;
      # it permits creation, which is all this needs.
      - name: Tag the published commit
        if: steps.plan.outputs.tag_missing == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898270+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      # Verify every canonical schema URL after the immutable release tag exists.
      - name: Verify published schema identifiers
        if: steps.plan.outputs.tag_missing == 'true' || steps.plan.outputs.release_missing == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          schemas=(schemas/*-v1.schema.json)
          for file in "${schemas[@]}"; do
            name="${file#schemas/}"
            id="$(node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(s["$id"] || "")' "$file")"
            case "$id" in
              https://raw.githubusercontent.com/hexrift/tamperward/v*/schemas/"$name") ;;
              *) echo "canonical id is not an immutable release URL in $file: $id"; exit 1 ;;
            esac
            tmp="$(mktemp)"
            ok=false
            for attempt in $(seq 1 10); do
              if curl --fail --silent --show-error --location "$id" -o "$tmp" && cmp -s "$tmp" "$file"; then ok=true; break; fi
              sleep 3
            done
            [ "$ok" = true ] || { echo "canonical URL bytes differ for $file: $id"; exit 1; }
            rm -f "$tmp"
          done

      # The release body is the CHANGELOG section for this version — written once, shown
      # everywhere — not the auto-generated PR list, which in a solo repo repeats
      # "by @<owner>" after every line and says nothing the changelog doesn't say better.
      # Falls back to --generate-notes only when the section is missing. Gated on the
      # release being absent, like the tag: a run that tagged and then failed here
      # converges on re-run. `gh release create` on an existing tag reuses it.
      - name: GitHub release
        if: steps.plan.outputs.release_missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          EXTRA=""
          case "$VERSION" in *-*) EXTRA="--prerelease";; esac
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed -e '1{/^$/d}' > /tmp/notes.md
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -v "^v${VERSION}$" | head -1 || true)"
          [ -n "$PREV" ] && printf '\n**Full Changelog**: %s/compare/%s...v%s\n' "${{ github.server_url }}/${{ github.repository }}" "$PREV" "$VERSION" >> /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file /tmp/notes.md $EXTRA
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes $EXTRA
          fi
