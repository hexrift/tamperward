name: release

# Publishing runs from CI, never a laptop: that is what lets npm attach PROVENANCE —
# a signed, verifiable link from the published tarball back to this repo, this commit,
# and this workflow. For a tool whose whole claim is verifiable integrity, publishing
# without it would be off-message.
on:
  push:
    tags: ['v*']

# No NPM_TOKEN. Authentication is npm TRUSTED PUBLISHING: npm trusts this repository's
# workflow directly, and GitHub mints a short-lived OIDC credential per run. That removes
# the long-lived secret entirely — nothing to leak, rotate or expire — which matters here
# beyond hygiene, since npm is withdrawing publish rights from bypass-2FA tokens.
#
# The trust relationship is configured on npmjs.com, not here: Packages -> tamperward ->
# Settings -> Trusted publishing, naming this repo and the workflow FILENAME (release.yml).
# Rename this file and publishing stops until that entry is updated to match.
permissions:
  contents: read
  id-token: write # mints the OIDC token npm exchanges for publish rights

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # NO registry-url. Setting it makes setup-node write an .npmrc containing
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and with no NODE_AUTH_TOKEN in the environment that expands to an EMPTY token.
      # npm then sees auth already configured, takes the token path, never attempts the
      # OIDC exchange, and the publish fails as an unauthenticated write — which the
      # registry reports as E404 ("not found or you do not have permission"), because it
      # will not disclose whether a package exists to a caller lacking rights. That is
      # exactly how v1.1.0-rc.1 failed. registry.npmjs.org is npm's default anyway, so
      # the line bought nothing but the broken .npmrc.
      #
      # Node 24: npm 12 is what `npm@latest` installs, and trusted publishing is only
      # supported on the current Node line. The docs still say 22.14+, but publishing is
      # not the place to sit on the older of two answers.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Node 22 bundles npm 10.x, which is BELOW the 11.5.1 trusted publishing needs — so
      # pinning setup-node@v6 alone was not enough and the first tag would have failed.
      # Upgrade npm explicitly rather than depending on whatever the Node line happens to
      # bundle, which changes under us.
      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@latest

      # Verify it rather than assume the upgrade worked: without this the publish fails
      # later with an auth error that looks like a credentials problem.
      - name: npm must support trusted publishing
        run: |
          set -euo pipefail
          NPM_V="$(npm --version)"
          echo "npm $NPM_V, node $(node --version)"
          node -e '
            const [a,b,c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " is older than 11.5.1; trusted publishing needs 11.5.1+"); process.exit(1); }
          ' "$NPM_V"

      - run: npm ci

      # The gate ships only if its own checks are green. prepublishOnly builds dist/.
      - run: npm run typecheck
      - run: npm test

      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG"; exit 1
          fi
          echo "publishing $PKG"

      # A prerelease must not become `latest`, or `npm install tamperward` starts handing
      # people a release candidate. Anything with a hyphen (1.1.0-rc.1) publishes under
      # the `next` dist-tag instead.
      - name: Publish
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) echo "prerelease $VERSION -> dist-tag next"; TAG=next ;;
            *)   echo "release $VERSION -> dist-tag latest";  TAG=latest ;;
          esac
          npm publish --provenance --access public --tag "$TAG"
