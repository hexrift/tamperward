name: release

# RELEASES ARE VERSION-DRIVEN, NOT TAG-DRIVEN. On every push to main, the version in
# package.json is compared against the registry: if the registry does not have it, this
# workflow publishes it and THEN creates the tag and GitHub release as the record of what
# shipped. Merging a version-bump PR is the release act — protected by the same branch
# rules as any other merge. A merge that does not change the version is a no-op here.
#
# Why not tags: a tag push was a second, manual, out-of-band step (and some environments
# cannot push tags at all). It also inverted the record: the tag asserted what WOULD be
# published, rather than recording what WAS. Order here is publish first, tag on success —
# a failed publish leaves no tag behind. Tags created by GITHUB_TOKEN do not trigger
# workflows, which is fine: nothing hangs off tags any more.
#
# Publishing runs from CI, never a laptop: that is what lets npm attach PROVENANCE — a
# signed, verifiable link from the published tarball back to this repo, this commit, and
# this workflow. For a tool whose whole claim is verifiable integrity, publishing without
# it would be off-message.
on:
  push:
    branches: [main]
  workflow_dispatch: # re-run a failed release for the same version; the guard makes it idempotent

# No NPM_TOKEN. Authentication is npm TRUSTED PUBLISHING: npm trusts this repository's
# workflow directly, and GitHub mints a short-lived OIDC credential per run. The trust
# relationship is configured on npmjs.com (Package -> Settings -> Trusted publishing) and
# matches this file by FILENAME — rename release.yml and publishing stops until that
# entry is updated to match.
permissions:
  contents: write # create the tag + GitHub release after a successful publish
  id-token: write # mints the OIDC token npm exchanges for publish rights

# One release at a time, and never cancel one mid-publish: a cancelled run could leave a
# published version with no tag. Queued runs re-check the registry and no-op.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # NO registry-url. Setting it makes setup-node write an .npmrc containing
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and with no NODE_AUTH_TOKEN in the environment that expands to an EMPTY token.
      # npm then sees auth already configured, takes the token path, never attempts the
      # OIDC exchange, and the publish fails as an unauthenticated write — reported as
      # E404, because the registry will not disclose whether a package exists to a caller
      # lacking rights. That is exactly how the v1.1.0-rc.1 release failed.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Node's bundled npm lags what trusted publishing needs — upgrade explicitly rather
      # than depending on whatever the Node line happens to bundle, which changes under us.
      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@latest

      # Verify it rather than assume the upgrade worked: without this the publish fails
      # later with an auth error that looks like a credentials problem.
      - name: npm must support trusted publishing
        run: |
          set -euo pipefail
          NPM_V="$(npm --version)"
          echo "npm $NPM_V, node $(node --version)"
          node -e '
            const [a,b,c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " is older than 11.5.1; trusted publishing needs 11.5.1+"); process.exit(1); }
          ' "$NPM_V"

      # The release gate: does the registry already have this version? Exit 0 from
      # `npm view pkg@version` means yes -> nothing to do. If this check fails
      # TRANSIENTLY (network), we proceed and the publish itself fails loudly on the
      # conflict — a wasted run, never a wrong publish: the registry rejects overwrites.
      - name: Decide whether this push releases
        id: plan
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "tamperward@${VERSION}" version >/dev/null 2>&1; then
            echo "tamperward@${VERSION} is already on the registry — nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "tamperward@${VERSION} is not on the registry — releasing it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # A typo in a version-bump PR must not move `latest` BACKWARDS. npm points `latest`
      # at whatever `--tag latest` publishes, even a LOWER version — so 1.0.2 published
      # after 1.1.0 would hand every fresh `npm install` the older code, with six green
      # checks and nothing comparing against what is already out. New versions must move
      # forward: a stable release must exceed the current `latest`; a prerelease must
      # exceed the current `next` as well. A stable is deliberately NOT compared against
      # `next` — shipping a 1.x stable while a 2.0 rc sits on `next` is legitimate.
      # `-p` (include-prerelease) is load-bearing: without it semver ranges exclude
      # prereleases and `1.2.0-rc.1 > 1.1.0` would wrongly fail. Backporting to an old
      # line would need this loosened; that is a problem to design for when it exists.
      - name: Version must move forward
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          # Per-tag queries, not `dist-tags --json`: npm 12 wraps that JSON in an ARRAY
          # where npm 10 returns an object, and jq indexing the array killed the 1.2.0
          # release at this step. `npm view pkg@tag version` prints a bare version on
          # both lines; a missing tag or package exits non-zero -> empty -> guard skipped.
          LATEST="$(npm view tamperward@latest version 2>/dev/null || true)"
          NEXT="$(npm view tamperward@next version 2>/dev/null || true)"
          forward() {
            [ -z "$2" ] && return 0
            if ! npx --yes semver@7 -p "$1" -r ">$2" >/dev/null; then
              echo "::error::${1} is not greater than the current ${3} (${2}) — refusing to publish a downgrade. If the bump is a typo, fix package.json; a deliberate re-publish of an older line needs this guard loosened first."
              exit 1
            fi
          }
          forward "$VERSION" "$LATEST" "latest"
          case "$VERSION" in *-*) forward "$VERSION" "$NEXT" "next";; esac
          echo "version $VERSION moves forward (latest=${LATEST:-none}, next=${NEXT:-none})"

      # The gate ships only if its own checks are green. prepublishOnly builds dist/.
      - if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - if: steps.plan.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.plan.outputs.publish == 'true'
        run: npm test

      # A prerelease must not become `latest`, or `npm install tamperward` starts handing
      # people a release candidate. Anything with a hyphen (1.1.0-rc.2) publishes under
      # the `next` dist-tag instead.
      - name: Publish
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          case "$VERSION" in
            *-*) echo "prerelease $VERSION -> dist-tag next"; TAG=next ;;
            *)   echo "release $VERSION -> dist-tag latest";  TAG=latest ;;
          esac
          npm publish --provenance --access public --tag "$TAG"

      # The tag is the RECORD, cut only after the registry accepted the publish. The tag
      # ruleset (release tags) forbids deleting or moving v* tags, so the record is
      # append-only; it permits creation, which is all this needs.
      - name: Tag the published commit
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898270+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      # The release body is the CHANGELOG section for this version — written once, shown
      # everywhere — not the auto-generated PR list, which in a solo repo repeats
      # "by @<owner>" after every line and says nothing the changelog doesn't say better.
      # Falls back to --generate-notes only when the section is missing.
      - name: GitHub release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          EXTRA=""
          case "$VERSION" in *-*) EXTRA="--prerelease";; esac
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed -e '1{/^$/d}' > /tmp/notes.md
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -v "^v${VERSION}$" | head -1 || true)"
          [ -n "$PREV" ] && printf '\n**Full Changelog**: %s/compare/%s...v%s\n' "${{ github.server_url }}/${{ github.repository }}" "$PREV" "$VERSION" >> /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file /tmp/notes.md $EXTRA
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes $EXTRA
          fi
