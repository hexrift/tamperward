name: release

# Publishing runs from CI, never a laptop: that is what lets npm attach PROVENANCE —
# a signed, verifiable link from the published tarball back to this repo, this commit,
# and this workflow. For a tool whose whole claim is verifiable integrity, publishing
# without it would be off-message.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The gate ships only if its own checks are green. prepublishOnly builds dist/.
      - run: npm run typecheck
      - run: npm test

      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG"; exit 1
          fi
          echo "publishing $PKG"

      # A prerelease must not become `latest`, or `npm install tamperward` starts handing
      # people a release candidate. Anything with a hyphen (1.1.0-rc.1) publishes under
      # the `next` dist-tag instead.
      - name: Publish
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) echo "prerelease $VERSION -> dist-tag next"; TAG=next ;;
            *)   echo "release $VERSION -> dist-tag latest";  TAG=latest ;;
          esac
          npm publish --provenance --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
