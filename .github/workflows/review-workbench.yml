name: review-workbench
on:
  push:
    branches: [fix/review-workbench]
    paths: ['.review/**', '.github/workflows/review-workbench.yml']
permissions:
  contents: read
concurrency:
  group: review-workbench
  cancel-in-progress: false
jobs:
  prepare-policy-fix:
    if: github.repository == 'hexrift/tamperward' && github.ref == 'refs/heads/fix/review-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dc4e7598a37fbd63a2218e717b20182f6d691023
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install pinned dependencies and add regression only
        working-directory: target
        run: |
          npm ci
          git apply --include='test/policy-nested-keys.test.ts' ../workbench/.review/policy-keys.patch
      - name: Require baseline assertion failures
        working-directory: target
        shell: bash
        run: |
          set +e
          npx vitest run test/policy-nested-keys.test.ts --reporter=json --outputFile=../policy-baseline.json
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import json
          d = json.load(open('../policy-baseline.json'))
          print({k: d.get(k) for k in ['numTotalTests', 'numPassedTests', 'numFailedTests', 'numRuntimeErrorTestSuites']})
          assert d['numTotalTests'] == 23 and d['numFailedTests'] == 20 and d['numPassedTests'] == 3
          assert not d.get('numRuntimeErrorTestSuites', 0)
          PY
      - name: Apply the exact locally tested patch
        working-directory: target
        run: |
          git apply --exclude='test/policy-nested-keys.test.ts' ../workbench/.review/policy-keys.patch
          git add CHANGELOG.md package.json package-lock.json src/policy-load.ts test/policy-nested-keys.test.ts
          test "$(git write-tree)" = d01db850170093da9ae95476ee157cb966e55915
          git diff --cached --check
      - name: Focused policy regressions
        working-directory: target
        run: npx vitest run test/policy-nested-keys.test.ts test/policy.test.ts test/policy-strict.test.ts test/organisation-policy-floor.test.ts test/verifier-backend-policy.test.ts
      - name: Typecheck build and repository integrity gate
        working-directory: target
        run: npm run typecheck && npm run build && node dist/cli/index.js check --staged
      - name: Full repository tests
        working-directory: target
        run: npm test
      - name: Publish only the tested engineering branch
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=dc4e7598a37fbd63a2218e717b20182f6d691023
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$expected"
          test "$(git write-tree)" = d01db850170093da9ae95476ee157cb966e55915
          if test -n "$(git ls-remote origin refs/heads/fix/nested-policy-keys)"; then
            echo 'Refusing to replace an existing implementation branch'; exit 1
          fi
          git switch -c fix/nested-policy-keys
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git commit -m 'fix: reject unknown nested policy fields'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/nested-policy-keys
          git show --stat --oneline HEAD
