name: review-workbench
on:
  push:
    branches: [fix/review-workbench]
    paths: ['.review/**', '.github/workflows/review-workbench.yml']
permissions:
  contents: read
concurrency:
  group: review-workbench
  cancel-in-progress: false
jobs:
  prepare-git-metadata-fix:
    if: github.repository == 'hexrift/tamperward' && github.ref == 'refs/heads/fix/review-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: workbench
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 67bd857f72b5a0f10617b3dc3aa5c68cd4122b7c
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install pinned dependencies and add regression only
        working-directory: target
        run: |
          npm ci
          git apply --include='test/git-rewrite-metadata.test.ts' ../workbench/.review/git-rewrite.patch
      - name: Require baseline assertion failures
        working-directory: target
        shell: bash
        run: |
          set +e
          npx vitest run test/git-rewrite-metadata.test.ts --reporter=json --outputFile=../git-baseline.json
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import json
          d = json.load(open('../git-baseline.json'))
          print({k: d.get(k) for k in ['numTotalTests', 'numPassedTests', 'numFailedTests', 'numRuntimeErrorTestSuites']})
          assert d['numTotalTests'] == 14 and d['numFailedTests'] == 13 and d['numPassedTests'] == 1
          assert not d.get('numRuntimeErrorTestSuites', 0)
          PY
      - name: Apply the exact locally tested implementation
        working-directory: target
        run: |
          git apply --exclude='test/git-rewrite-metadata.test.ts' ../workbench/.review/git-rewrite.patch
          git add CHANGELOG.md package.json package-lock.json schemas/run-v1.schema.json src/cli/run.ts src/git/trusted.ts src/machine-output.ts test/git-rewrite-metadata.test.ts
          test "$(git write-tree)" = 7ae8b2002660c06e7f34567797c2c0a93faeb2ec
          git diff --cached --check
      - name: Focused metadata envelope and schema regressions
        working-directory: target
        run: npx vitest run test/git-rewrite-metadata.test.ts test/audit-1-6.test.ts test/json-schema.test.ts
      - name: Verify source identity and typecheck
        working-directory: target
        run: |
          git diff --exit-code
          git write-tree
          git hash-object src/git/trusted.ts src/disk.ts
          nl -ba src/git/trusted.ts | sed -n '25,110p'
          node --version
          node node_modules/typescript/bin/tsc --version
          npm run typecheck
      - name: Build and repository integrity gate
        working-directory: target
        run: npm run build && node dist/cli/index.js check --staged
      - name: Full repository tests
        working-directory: target
        run: npm test
      - name: Publish only the tested engineering branch
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=67bd857f72b5a0f10617b3dc3aa5c68cd4122b7c
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$expected"
          test "$(git write-tree)" = 7ae8b2002660c06e7f34567797c2c0a93faeb2ec
          git diff --exit-code
          if test -n "$(git ls-remote origin refs/heads/fix/git-rewrite-metadata)"; then
            echo 'Refusing to replace an existing implementation branch'; exit 1
          fi
          git switch -c fix/git-rewrite-metadata
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git commit -m 'fix: bound Git rewrite metadata and reject uninspectable state'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/git-rewrite-metadata
          git show --stat --oneline HEAD
