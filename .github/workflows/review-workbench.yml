name: review-workbench
on:
  push:
    branches: [fix/review-workbench]
    paths: ['.review/**', '.github/workflows/review-workbench.yml']
permissions:
  contents: read
concurrency:
  group: review-workbench
  cancel-in-progress: false
jobs:
  export-test-workspace:
    if: github.repository == 'hexrift/tamperward' && github.ref == 'refs/heads/fix/review-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0fcd0b684b9bade8ff3ee290ed5493909dc526b3
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install the pinned public dependencies
        working-directory: target
        run: npm ci
      - name: Export source, dependency tree and public history only
        shell: bash
        run: |
          set -euo pipefail
          mkdir export
          git -C target bundle create "$PWD/export/history.bundle" --all HEAD
          tar -C target --exclude='./.git' -czf export/workspace.tar.gz .
          cp "$(command -v node)" export/node
          git -C target rev-parse HEAD > export/HEAD.txt
          (cd export && sha256sum workspace.tar.gz history.bundle node > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: review-offline-workspace
          path: export/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
