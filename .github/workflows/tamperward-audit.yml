name: tamperward-audit

# Durable dogfooding evidence, deliberately separate from the enforcement gate.
# The hook never writes GitHub directly, and this workflow is the ONLY writer to
# the tamperward-audit evidence branch. The invariant: nothing UNREVIEWED or
# candidate-controlled may cause evidence to enter it. Humans decide what enters
# (a reviewed PR, and — where branch protection requires it — a code-owner
# review); automation only performs deterministic, idempotent ingestion.
#
# Two curated entry points, both running only from the trusted copy on main:
#   - an operator dispatches a validated batch by hand (workflow_dispatch), or
#   - a reviewed PR adds an IMMUTABLE batch audit/pending/<batch-id>.jsonl and,
#     on merge to main, this workflow ingests any batch whose id/content hash is
#     not already recorded.
# There is deliberately NO pull_request / pull_request_target trigger.
#
# Security split (review of #502): the WRITE token and the evidence-branch push
# are isolated in the `publish` job, which runs NO npm ci and NO candidate/
# dependency code — only first-party actions, a dependency-free re-validation
# against the committed schema, and git. The `prepare` job builds and validates
# with `contents: read` only and `persist-credentials: false`, so the write
# credential is never present while `npm ci`, the build, or candidate package
# code executes. Committed batches are ALSO validated pre-merge by the normal CI
# suite (test/audit-pending-batches.test.ts), so a malformed batch cannot reach
# this privileged path. Never commit TAMPERWARD_DENYLOG here — only audit-v1.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Validated TamperWard audit-v1 JSONL (never TAMPERWARD_DENYLOG); may be empty for a rebuild"
        required: false
        default: ""
        type: string
      rebuild:
        description: "Regenerate the index shards and summaries by streaming every stored partition (#518)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tamperward-audit-store
  cancel-in-progress: false

jobs:
  # ---- prepare: read-only. Performs the expensive canonical validation only.
  # It never creates a replacement evidence-store artifact. ------------------
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      has_new: ${{ steps.scan.outputs.has_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pending batches not yet ingested
        id: scan
        env:
          # Read-only token, used only to read the evidence branch. Deliberately
          # NOT exposed to the npm ci / build steps below.
          GH_TOKEN: ${{ github.token }}
          DISPATCH_BATCH: ${{ inputs.batch }}
        run: |
          set -euo pipefail
          # `runner`/`github.workspace` are not valid in a workflow-level `env`,
          # so derive the paths here from the always-present runtime variables.
          AUDIT_WORK="${RUNNER_TEMP}/audit-work"
          mkdir -p "${AUDIT_WORK}/candidates"

          # Only the ingestion ledger comes down (#518): a blob-less clone of the
          # evidence branch with one file checked out, whatever the store holds.
          bash .github/audit/audit-store-git.sh clone-ledger \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "${AUDIT_WORK}/store"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            printf '%s\n' "${DISPATCH_BATCH}" > "${AUDIT_WORK}/candidates/dispatch-${GITHUB_RUN_ID}.jsonl"
          elif [ -d audit/pending ]; then
            find audit/pending -maxdepth 1 -type f -name '*.jsonl' -exec cp {} "${AUDIT_WORK}/candidates/" \; 2>/dev/null || true
          fi

          # Pure-node prescan (no build): which candidate batches are new, failing
          # closed if an already-ingested batch id reappears with changed content.
          node "${GITHUB_WORKSPACE}/.github/audit/audit-prescan.mjs" \
            "${AUDIT_WORK}/candidates" "${AUDIT_WORK}/store/ingested/batches.jsonl" "${AUDIT_WORK}/new-batches.txt"

          if [ -s "${AUDIT_WORK}/new-batches.txt" ]; then
            echo "has_new=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_new=false" >> "${GITHUB_OUTPUT}"
            echo "No new audit batches to ingest."
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scan.outputs.has_new == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.scan.outputs.has_new == 'true'
        run: npm ci
      - if: steps.scan.outputs.has_new == 'true'
        run: npm run build

      - name: Validate each new batch
        if: steps.scan.outputs.has_new == 'true'
        run: |
          set -euo pipefail
          AUDIT_WORK="${RUNNER_TEMP}/audit-work"
          while IFS= read -r batch; do
            [ -n "${batch}" ] || continue
            node dist/cli/index.js stats --file "${batch}" --json > /dev/null
          done < "${AUDIT_WORK}/new-batches.txt"

  # ---- publish: the only job with a write credential. Runs NO npm ci and NO
  # candidate code — first-party actions, a dependency-free re-validation against
  # the committed schema, and git. -------------------------------------------
  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && (needs.prepare.outputs.has_new == 'true' || inputs.rebuild == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and commit trusted evidence to the tamperward-audit branch
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_BATCH: ${{ inputs.batch }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          STORE="${RUNNER_TEMP}/publish"
          CANDIDATES="${RUNNER_TEMP}/audit-candidates"
          CHANGED="${RUNNER_TEMP}/audit-changed-paths.txt"

          # A blob-less, sparse clone (#518): the ledger, the index shards and the
          # summaries come down, the historical partitions do not. A requested
          # rebuild streams every partition, so it takes a full checkout instead.
          MODE=""
          PUBLISH_FLAGS=()
          if [ "${REBUILD}" = "true" ]; then MODE="--full"; PUBLISH_FLAGS+=(--rebuild); fi
          bash .github/audit/audit-store-git.sh clone-store "${REMOTE}" "${STORE}" ${MODE}

          mkdir -p "${CANDIDATES}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            printf '%s\n' "${DISPATCH_BATCH}" > "${CANDIDATES}/dispatch-${GITHUB_RUN_ID}.jsonl"
          elif [ -d audit/pending ]; then
            find audit/pending -maxdepth 1 -type f -name '*.jsonl' -exec cp {} "${CANDIDATES}/" \; 2>/dev/null || true
          fi

          # Each new batch becomes its own immutable partition file; only the
          # index shards it touches, the ledger tail and the derived summaries
          # change. The publisher lists what it wrote and only that is staged.
          node .github/audit/audit-publish.mjs \
            schemas/audit-v1.schema.json "${CANDIDATES}" "${STORE}" "${GITHUB_SHA}" \
            --changed-paths "${CHANGED}" "${PUBLISH_FLAGS[@]}"

          if [ "$(bash .github/audit/audit-store-git.sh stage "${STORE}" "${CHANGED}")" = "nothing" ]; then
            echo "No new audit evidence to persist."
            exit 0
          fi

          git -C "${STORE}" config user.name github-actions[bot]
          git -C "${STORE}" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "${STORE}" commit -q -m "audit: ingest TamperWard self-hosting events"
          git -C "${STORE}" push origin HEAD:refs/heads/tamperward-audit
