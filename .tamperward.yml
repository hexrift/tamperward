version: 1

# The safety nets, treated as protected assets whose weakening is the signal.
protected:
  tests: ['**/*.test.ts', '**/*.spec.ts', '**/*.{test,spec}.{tsx,cts,mts,js,jsx,cjs,mjs}', '**/__tests__/**']
  config:
    - '**/jest.config.*'
    - '**/vitest.config.*'
    - '**/tsconfig*.json'
    - '**/.eslintrc*'
    - '**/eslint.config.*'
    - '**/package.json'
  ci: ['.github/workflows/**']
  hooks: ['.husky/**', '**/lefthook.*', '.tamperward.yml', '**/.tamperward.yml']

# Excluded from file-surface detection. This is a SELF-HOSTING exception, reported and
# not silent: Tamperward's own rule definitions and docs literally contain the patterns
# the rules look for (`as any`, `it.skip`, `--no-verify`) as data, not as real bypasses.
# A consumer repo would not need this. The command surface (no-verify, shell mutation)
# is never path-scoped, so it still runs everywhere.
ignore:
  - '**/*.md' # docs describe the bypasses by name
  - 'src/detectors/**' # the rules contain the patterns they detect
  - 'test/**' # fixtures and cases are bypass examples by design
  - 'harness/**' # seeds and oracles are SCENARIO content (test files as fixtures,
    # cheat patterns as data), not this repo's safety nets; seed churn is routine and
    # each redesign was costing an out-of-band label (ninth self-block, PR #48)

rules:
  # mechanical — 100% deterministic, may block
  test-deletion: { severity: block } # AST (count-based) + rename-out-of-glob + rm/sed/>
  test-skip: { severity: block }
  ts-any-cast: { severity: block }
  lint-suppression: { severity: block }
  coverage-lowering: { severity: block }
  ci-tampering: { severity: block }
  hook-tampering: { severity: block }
  no-verify: { severity: block }
  # RESERVED names with no detector behind them (SPEC §4 rows 3 and 10, §10): they
  # get built only against the negatives corpus and stay warn until precision is
  # measured. Listed so the severity is on record, not because anything fires.
  assertion-weakening: { severity: warn }
  guard-removal: { severity: warn }

signoff:
  required_for: [block]
  # LOCAL ONLY. In CI, sign-off is out-of-band (PR label + branch protection +
  # CODEOWNERS on protected paths) — never a committed file. See SPEC.md §5.4.
  ledger: .tamperward/ledger.jsonl
