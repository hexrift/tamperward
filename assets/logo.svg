<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tamperward">
  <title>Tamperward</title>
  <defs>
    <linearGradient id="tw-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- The gate, as a sealed boundary rather than an outline: every change passes
       through it, and nothing passes around it. -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tw-g)"/>
  <!-- The warded keyway. A ward is the obstruction inside a lock that blocks the wrong
       key - the shape only admits a change that genuinely fits.
       The wards sit on ONE side, low on the blade, where a real key's bit carries them.
       That asymmetry is load-bearing: a symmetric head-and-shoulders silhouette reads as
       a person icon, which is the last thing this mark should say.
       The transform is optical centring, not geometric - scaled about the middle, then
       nudged up and left so the heavy bow balances the thin wards rather than the
       bounding box balancing itself. -->
  <g transform="translate(-2.3 -2.6) scale(1.05)"
     fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round">
    <circle cx="30.5" cy="24" r="6.2"/>
    <path d="M27.8 28.6 L33.2 28.6 L33.2 35.4 L38.6 35.4 L38.6 38.8 L33.2 38.8 L33.2 42.6 L36.8 42.6 L36.8 46 L33.2 46 L33.2 48.6 L27.8 48.6 Z"/>
  </g>
</svg>
