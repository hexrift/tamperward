<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tamperward">
  <title>Tamperward</title>
  <defs>
    <linearGradient id="tw-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- The seam is negative space: the two halves are one shape with a gap, so the mark
         works on any background without carrying a background of its own. -->
    <mask id="tw-seam">
      <rect width="64" height="64" fill="#fff"/>
      <polyline points="1,37 15,37 15,27 27,27 27,37 37,37 37,27 49,27 49,37 63,37"
                fill="none" stroke="#000" stroke-width="4" stroke-linejoin="miter" stroke-linecap="square"/>
    </mask>
  </defs>
  <!-- The seal: two interlocking castellated halves, meshed with no play. Tamperward
       does not ask WHO made a change - the agent is fully authorized. It asks whether
       the change FITS without weakening a safety net, and an intact meshed seam is that
       verdict drawn: nothing slipped through the joint.
       The castellation is also the older sense of the name. A ward is the obstruction
       in a lock that blocks the wrong key - and the walled enclosure of a castle. One
       cut, both meanings, no padlock. -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tw-g)" mask="url(#tw-seam)"/>
</svg>
