<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Tamperward ward glyph">
  <title>Tamperward</title>
  <!-- The ward glyph: four strokes of change converge; the ward stops them at the
       exact point. Rendered via <img> on GitHub, so the media query follows the
       reader's OS scheme — the closest an inline README image can get to dark mode. -->
  <style>
    .ink { stroke: #0f172a; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #e2e8f0; } }
  </style>
  <g fill="none" stroke-linecap="round" stroke-width="9">
    <g class="ink">
      <path d="M15 13 42 40"/>
      <path d="M15 87 42 60"/>
      <path d="M85 13 58 40"/>
      <path d="M85 87 58 60"/>
    </g>
    <g stroke="#2563eb">
      <path d="M9 50 H42"/>
      <path d="M58 50 H91"/>
    </g>
  </g>
</svg>
