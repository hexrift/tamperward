<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tamperward">
  <title>Tamperward</title>
  <!-- The gate: a closed boundary every change must pass through. -->
  <rect x="6" y="6" width="52" height="52" rx="13"
        fill="none" stroke="#64748B" stroke-width="4"/>
  <!-- The warded keyway. A ward is the obstruction inside a lock that blocks
       the wrong key — the shape only admits a change that genuinely fits. -->
  <g fill="#3B82F6">
    <circle cx="32" cy="25" r="6.5"/>
    <path d="M29 30 L35 30 L36.5 46 L27.5 46 Z"/>
    <rect x="23.5" y="34.5" width="5.5" height="3.5" rx="1"/>
    <rect x="35" y="34.5" width="5.5" height="3.5" rx="1"/>
  </g>
</svg>
