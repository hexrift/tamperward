<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="1440" height="920" role="img" aria-labelledby="tw-arch-title tw-arch-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="tw-arch-title">Tamperward complete architecture</title>
<desc id="tw-arch-desc">A left-to-right architecture map. Setup establishes trusted inputs and local wiring. The agent works under in-loop steering and leaves a candidate tree. TamperWard independently adjudicates the candidate with change checks and visible and pristine verification. Protected CI repeats the authoritative checks across a trust boundary before branch protection permits merge to main. Release then publishes the reviewed main commit. Optional support tools sit below the primary flow and do not participate in the final verdict.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
</defs>

