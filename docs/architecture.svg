<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" width="1440" height="940" role="img" aria-labelledby="tw-arch-title tw-arch-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="tw-arch-title">Tamperward complete architecture</title>
<desc id="tw-arch-desc">A left-to-right architecture map. Setup installs the local and CI wiring. The tamperward run envelope freezes the entry state, supervises the agent while in-loop steering gates its edits, and then adjudicates the candidate the agent leaves behind with change checks and visible-and-pristine verification, emitting a local verdict that stays local. Independently, the candidate commit is pushed as a pull request into protected CI, which re-adjudicates it against the trusted base on the PR's own head; the repository rules — a required check, Code Owner review, and dismissal of stale approvals — are what authorize merge to main, not the workflow copy. Release then publishes the reviewed main commit only when its version is not already published. Trusted base inputs feed adjudication and CI, never the agent. Secondary tools sit below and are not independent final authorities.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f9d58"/></marker>
  <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
</defs>

