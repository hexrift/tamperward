# Round-4 mining. Mechanical: no Claude, no model, no API key.
#
#   docker compose -f docker/docker-compose.yml up --build mine
#
# and, from another terminal, INSIDE the same running container:
#
#   docker compose -f docker/docker-compose.yml exec mine ./status.sh pilot
#
# `exec` matters. An earlier version of this file offered a separate `status`
# service, which was wrong: `run` starts a NEW container with its own PID
# namespace, so it shares the volume's files but sees none of the miner's
# processes. It would have reported "mining sessions 0" and "killed outright"
# while mining was perfectly healthy — a false alarm of exactly the kind this
# apparatus keeps producing. `exec` enters the running container and sees its
# processes, so the session count means what it says.
#
# After the run: `docker compose -f docker/docker-compose.yml ps -a` for the
# container's exit status and `... logs mine` for its complete output. Those are
# the container's equivalent of launch-mine.sh's status and log files, which the
# foreground container deliberately does not create.
services:
  mine:
    build:
      context: ../../../..
      dockerfile: harness/taskbench/round4/docker/Dockerfile
    # Pinned, not inherited from the host. An Apple Silicon Mac defaults to
    # arm64, and mining eligibility can differ by architecture — a package with
    # no arm64 wheel fails to install and its repository is rejected, which the
    # x86_64 decisions already in the ledger would not have done. Every pilot
    # and counted repository must be decided on ONE architecture.
    platform: linux/amd64
    working_dir: /work/harness/taskbench/round4
    volumes:
      - ../../../..:/work
      - tb-work:/tmp/tb
    environment:
      TB_RUNTIME_DIR: /tmp/tb
      # Parameterised so ONE compose serves any pool and any pilot iteration — no
      # per-round or per-iteration file. Iteration 1 was TB_POOL=pilot; iteration 2
      # (after 2.10.3) is TB_POOL=pilot-i2, mining the fresh ten from the next
      # positions. Override on the host: `TB_POOL=pilot-i2 docker compose ... up mine`.
      TB_POOL: ${TB_POOL:-pilot}
      TB_PILOT_NEED: ${TB_PILOT_NEED:-10}
    # Foreground and sequential. The container IS the supervisor, so there is
    # nothing to detach from and nothing to reap it, and launch-mine.sh is not
    # used: Docker records the exit status and captures the output itself.
    # Ctrl-C stops it; rerun to resume from the ledger (mine5 skips repos that
    # already carry a terminal verdict in the pool's attrition.jsonl).
    command: ["bash", "-c", "./mine5.sh"]
    # The pilot is sequential by protocol; these are ceilings, not targets.
    mem_limit: 8g
    cpus: 2.0

volumes:
  tb-work:
